<style>
  .lost { min-height: 100vh; display: grid; place-items: center; padding: 40px var(--gut); }

  .tabs a { writing-mode: vertical-rl; transform: rotate(180deg); padding: 14px 8px; font: 700 13px var(--type); text-decoration: none; border-left: 2px dashed var(--ink); text-align: left; justify-self: stretch; }
  .tabs a:last-child { border-left: 0; }
  .tabs a:hover { background: var(--brass); }
</style>
